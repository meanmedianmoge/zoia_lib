app-id: io.github.meanmedianmoge.zoia_lib
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
command: zoia-librarian
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=x11
  - --device=dri
  - --filesystem=home
  - --filesystem=/run/media
  - --filesystem=/media
build-options:
  env:
    PYTHONPATH: /app
modules:
  - name: zoia-lib
    buildsystem: simple
    sources:
      - type: dir
        path: ../..
    build-commands:
      - python3 -m pip install --no-deps --prefix=/app -r requirements.txt
      - python3 -m pip install --no-deps --prefix=/app tools/nodegraph/nodegraphqt-0.1.7-py3-none-any.whl
      - install -D -m 755 tools/flatpak/zoia-librarian.sh /app/bin/zoia-librarian
      - install -D -m 644 tools/flatpak/io.github.meanmedianmoge.zoia_lib.desktop /app/share/applications/io.github.meanmedianmoge.zoia_lib.desktop
      - install -D -m 644 tools/flatpak/io.github.meanmedianmoge.zoia_lib.metainfo.xml /app/share/metainfo/io.github.meanmedianmoge.zoia_lib.metainfo.xml
      - install -D -m 644 zoia_lib/interface/resources/splash.png /app/share/icons/hicolor/256x256/apps/io.github.meanmedianmoge.zoia_lib.png
      - mkdir -p /app/zoia_lib
      - cp -R zoia_lib /app/zoia_lib
