[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zoia-lib"
version = "2.1"
description = "Patch manager/librarian for the Empress Effects ZOIA pedal-format modular effects unit."
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.11"
# NodeGraphQt is also required at runtime; it is installed from the
# bundled wheel in tools/nodegraph/ (see tools/env.sh) because the
# project pins a patched build that is not on PyPI.
dependencies = [
    "psutil>=5.7.0",
    "PySide6>=6.6.0",
    "urllib3==2.6.3",
    "furl==2.1.3",
    "certifi==2024.7.4",
    "requests==2.32.4",
    "jsonschema==4.17.3",
    "rarfile~=4.0",
    # The bundled NodeGraphQt wheel imports distutils, which was
    # removed from the standard library in Python 3.12; setuptools
    # provides it.
    "setuptools",
]

[project.urls]
Homepage = "https://github.com/meanmedianmoge/zoia_lib"
Documentation = "https://github.com/meanmedianmoge/zoia_lib/tree/master/documentation"

[project.gui-scripts]
zoia-librarian = "zoia_lib.backend.startup:main"

[tool.setuptools.packages.find]
include = ["zoia_lib*"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    # Generated by pyside6-uic from ZOIALibrarian.ui; do not lint.
    "zoia_lib/interface/ZOIALibrarian.py",
    "tools",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
# The legacy code base predates the formatter; long lines are not
# worth churning for now.
ignore = ["E501"]
